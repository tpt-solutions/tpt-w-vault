[package]
name = "tpt-vault-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "tpt-vault: platform-windows crate"

[dependencies]
tpt-vault-core = { version = "0.1.0", path = "../core" }

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_System_Com", "Security_Credentials_UI", "Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_WinRT"] }
windows-future = "0.2"
