[package]
name = "tpt-vault-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "tpt-vault: core crate"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
aes-gcm = "0.10"
aes-siv = "0.7"
base64 = "0.22"
hkdf = "0.12"
rand = "0.8"
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
